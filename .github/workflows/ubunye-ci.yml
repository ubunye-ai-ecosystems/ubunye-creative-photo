# Ubunye CI gate. Upstream workflows are left as they are; this file is Ubunye-owned.
name: ubunye-ci
on:
  pull_request:
    branches: [develop, "release/**", main]
  push:
    branches: [develop]
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ubunye-ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Upstream's all-language UI tests draw real CJK, Arabic and Devanagari labels and panic on a
  # missing glyph, so tests run with the pinned craft-fonts, as upstream's CI does.
  CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
  CRAFT_FONTS_REQUIRED: "1"

jobs:
  build-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4            # TODO(M2): pin by SHA
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev mesa-vulkan-drivers
      - name: Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2         # TODO(M2): pin by SHA
      - name: Fonts (craft-fonts, the revision upstream's ci.yml and release.yml pin)
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-nextest@0.9.150
      - name: Build
        run: cargo build --locked --workspace
      # nextest with upstream's `ci` profile (.config/nextest.toml): one process per test and at
      # most four GPU devices at once; `cargo test` ran the GPU tests on one shared device.
      - name: Test
        run: cargo nextest run --profile ci --locked --workspace
      - name: Doctests
        run: cargo test --locked --workspace --doc
      - name: Smoke (import → edit → save → reopen → export)
        if: runner.os != 'Windows' && hashFiles('ubunye/scripts/smoke.sh') != ''
        run: bash ubunye/scripts/smoke.sh "$PWD/target/debug/photocraft-cli" "$RUNNER_TEMP/smoke"

  upstream-gate:
    # Upstream's own full gate (fmt, clippy -D warnings, tests, layers, assets, wasm).
    # Informational until a green baseline is recorded in ubunye/DEVELOPMENT.md.
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgtk-3-dev
      - uses: Swatinem/rust-cache@v2
      - name: Fonts (craft-fonts, the revision upstream's ci.yml and release.yml pin)
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      - run: cargo xtask ci

  brand-leak:
    # Blocking since the rebrand was applied: no ArtCraft marks, upstream ids or links, and every
    # brand rule still applied (rerun `python -I ubunye/brand/apply.py` after an upstream merge).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Brand check
        run: python -I ubunye/brand/apply.py --check
